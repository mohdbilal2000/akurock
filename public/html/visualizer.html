              <div class="av-dock">
                <div class="av-picker" id="av-picker"><!-- stone swatches injected by JS --></div>
                <div class="av-controls">

                      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>

                    <span class="av-sr">Zurücksetzen</span>

            <script>
              (function () {
                // The slat faces are cut out of the straight-on product samples, so the
                // colour and grain match the real panel instead of a rock close-up.
                var STONES = [
                  { slug: 'whisper', name: 'Whisper', tex: '/images/Whisper_sample.png', sw: '/images/6672b845e7846b687ecca399_Whisper_Stone.webp' },
                  { slug: 'brush',   name: 'Brush',   tex: '/images/Brush_sample.png',   sw: '/images/6672c465bb2c1f412c8d9dbd_Brush_Stone.webp' },
                  { slug: 'gaia',    name: 'Gaia',    tex: '/images/Gaia_sample.png',    sw: '/images/6672c5618fb534f344983a07_Gaia_Stone.webp' },
                  { slug: 'yami',    name: 'Yami',    tex: '/images/Yami_sample.png',    sw: '/images/6672c50ce1fa6622177a75ca_Yami_Stone.webp' },
                  { slug: 'yuki',    name: 'Yuki',    tex: '/images/Yuki_sample.png',    sw: '/images/6672c64c321c865a6ece5d6d_Yuki_Stone.webp' },
                  { slug: 'ligia',   name: 'Ligia',   tex: '/images/Ligia_sample.png',   sw: '/images/6672c5d54c31e70e1894d52f_ligia_Stone.webp' }
                ];
                // Pixel geometry of those samples (185 x 436): three fully visible slat
                // faces, measured from the images themselves.
                var SAMPLE = { w: 185, h: 436, faces: [[0, 41], [64, 105], [123, 164]] };
                // Only rooms with a *bare* wall belong here — the styled bedroom shots
                // already have slat panels on the wall, which made the preview
                // impossible to read.
                var ROOMS = ['/images/Preparing-the-wall.webp'];
                // Panel geometry in millimetres (real product) — used so the rendered
                // slat pitch stays proportional to the panel height instead of being
                // an arbitrary CSS repeat.
                var PANEL_H_MM = 2400, SLAT_PITCH_MM = 42.8, SLAT_FACE_RATIO = 0.72;
                var DEFAULT_RECT = { x: 0.52, y: 0.10, w: 0.32, h: 0.78 };

                var picker = document.getElementById('av-picker');
                var rooms = document.getElementById('av-rooms');
                var panel = document.getElementById('av-panel');
                var slats = document.getElementById('av-slats');
                var stage = document.getElementById('av-stage');
                var wrap = document.getElementById('av-stage-wrap');
                var room = document.getElementById('av-room');
                var hint = document.getElementById('av-hint');
                var cta = document.getElementById('av-cta');
                var light = document.getElementById('av-light');
                var upload = rooms.querySelector('.av-upload');

                // Panel position/size is kept as fractions of the visible photo, so it
                // stays on the same spot of the wall when the viewport resizes or the
                // phone is rotated.
                var rect = { x: DEFAULT_RECT.x, y: DEFAULT_RECT.y, w: DEFAULT_RECT.w, h: DEFAULT_RECT.h };
                var current = STONES[0];
                var objectUrl = null;
                var ownPhoto = false;

                function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

                // ---- the stage takes the exact shape of the photo, so nothing of
                //      the visitor's own room photo is cropped away and there are no
                //      empty letterbox bars around it ----
                function layoutFrame() {
                  var sw = wrap.clientWidth, sh = wrap.clientHeight;
                  if (!sw || !sh) return;
                  if (ownPhoto) {
                    // the visitor's own photo is shown whole — never cropped
                    var iw = room.naturalWidth || 4, ih = room.naturalHeight || 3;
                    var scale = Math.min(sw / iw, sh / ih);
                    stage.style.width = Math.round(iw * scale) + 'px';
                    stage.style.height = Math.round(ih * scale) + 'px';
                  } else {
                    // demo rooms fill the stage (we can crop our own photos)
                    stage.style.width = sw + 'px';
                    stage.style.height = sh + 'px';
                  }
                  applyRect();
                }

                function applyRect() {
                  panel.style.left = (rect.x * 100) + '%';
                  panel.style.top = (rect.y * 100) + '%';
                  panel.style.width = (rect.w * 100) + '%';
                  panel.style.height = (rect.h * 100) + '%';
                  renderSlats();
                }

                // ---- draw the panel as real slats: stone faces with felt grooves
                //      between them, lit from the left like the demo rooms ----
                var slatFrame = 0;
                function renderSlats() {
                  cancelAnimationFrame(slatFrame);
                  slatFrame = requestAnimationFrame(function () {
                    var w = panel.clientWidth, h = panel.clientHeight;
                    if (!w || !h) return;
                    var pitch = Math.max(6, h * (SLAT_PITCH_MM / PANEL_H_MM));
                    var count = Math.max(3, Math.round(w / pitch));
                    pitch = w / count;
                    var face = Math.max(2, pitch * SLAT_FACE_RATIO);
                    // every slat is its own strip of stone: the texture is scaled to
                    // the slat, and each slat starts at a different point of it, so the
                    // grain varies from slat to slat the way the real product does
                    var html = '';
                    for (var i = 0; i < count; i++) {
                      var left = i * pitch + (pitch - face) / 2;
                      // rotate through the sample's three slat faces and shift each slat
                      // vertically, so no two slats show the same piece of stone
                      var src = SAMPLE.faces[i % SAMPLE.faces.length];
                      var scale = face / (src[1] - src[0] + 1);
                      // stretched along the slat so at most a couple of repeats fit —
                      // real veneer runs the full length, and tiling seams would read
                      // as brickwork
                      var bgW = SAMPLE.w * scale;
                      var bgH = Math.max(SAMPLE.h * scale * 2, h * 0.55);
                      var offsetY = ((i * 37) % 100) / 100 * bgH;
                      html += '<i class="av-slat" style="left:' + left.toFixed(2) + 'px;width:' + face.toFixed(2) +
                        'px;background-size:' + bgW.toFixed(2) + 'px ' + bgH.toFixed(2) + 'px;background-position:' +
                        (-src[0] * scale).toFixed(2) + 'px ' + (-offsetY).toFixed(2) + 'px"></i>';
                    }
                    slats.innerHTML = html;
                  });
                }

                function selectStone(s) {
                  current = s;
                  panel.style.setProperty('--av-tex', 'url("' + s.tex + '")');
                  Array.prototype.forEach.call(picker.children, function (c) {
                    var on = c.getAttribute('data-slug') === s.slug;
                    c.classList.toggle('active', on);
                    c.setAttribute('aria-pressed', on ? 'true' : 'false');
                  });
                  // keep whatever locale prefix the page was rendered with
                  cta.setAttribute('href', cta.getAttribute('href').replace(/\/product\/[^/?#]+/, '/product/' + s.slug));
                  cta.setAttribute('aria-label', 'Zum Produkt ' + s.name);
                }

                STONES.forEach(function (s) {
                  var b = document.createElement('button');
                  b.type = 'button';
                  b.className = 'av-swatch';
                  b.setAttribute('data-slug', s.slug);
                  b.setAttribute('aria-pressed', 'false');
                  b.innerHTML = '<span class="av-swatch-img" style="background-image:url(\'' + s.sw + '\')"></span>' +
                    '<span class="av-swatch-name">' + s.name + '</span>';
                  b.addEventListener('click', function () { selectStone(s); });
                  picker.appendChild(b);
                });
                selectStone(STONES[0]);

                // ---- room presets + own photo ----
                function setRoom(src, isUpload) {
                  if (objectUrl && !isUpload) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
                  ownPhoto = !!isUpload;
                  room.src = src;
                  rect = { x: DEFAULT_RECT.x, y: DEFAULT_RECT.y, w: DEFAULT_RECT.w, h: DEFAULT_RECT.h };
                  Array.prototype.forEach.call(rooms.children, function (c) {
                    c.classList.toggle('active', c.getAttribute('data-src') === src);
                  });
                }
                ROOMS.forEach(function (src, i) {
                  var b = document.createElement('button');
                  b.type = 'button';
                  b.className = 'av-room-tile' + (i === 0 ? ' active' : '');
                  b.setAttribute('data-src', src);
                  b.setAttribute('aria-label', 'Demoraum ' + (i + 1));
                  b.style.backgroundImage = 'url("' + src + '")';
                  b.addEventListener('click', function () { setRoom(src, false); });
                  rooms.insertBefore(b, upload);
                });
                document.getElementById('av-file').addEventListener('change', function (e) {
                  var f = e.target.files && e.target.files[0];
                  if (!f) return;
                  if (objectUrl) URL.revokeObjectURL(objectUrl);
                  objectUrl = URL.createObjectURL(f);
                  setRoom(objectUrl, true);
                  upload.classList.add('active');
                  e.target.value = '';
                });

                room.addEventListener('load', layoutFrame);
                if (room.complete) layoutFrame();
                window.addEventListener('resize', layoutFrame);
                if (window.ResizeObserver) new ResizeObserver(layoutFrame).observe(wrap);

                // ---- hint: show once, then get out of the way ----
                var hintTimer = setTimeout(hideHint, 6000);
                function hideHint() { clearTimeout(hintTimer); hint.classList.add('av-hidden'); }

                // ---- drag, corner resize and pinch-to-scale (mouse + touch) ----
                var pointers = {}, mode = null, corner = null, start = null;

                function frameBox() { return stage.getBoundingClientRect(); }

                function beginDrag(e) {
                  var b = frameBox();
                  start = {
                    x: e.clientX, y: e.clientY,
                    rect: { x: rect.x, y: rect.y, w: rect.w, h: rect.h },
                    bw: b.width, bh: b.height
                  };
                }

                panel.addEventListener('pointerdown', function (e) {
                  var handle = e.target.closest ? e.target.closest('.av-handle') : null;
                  pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
                  panel.setPointerCapture(e.pointerId);
                  hideHint();
                  if (Object.keys(pointers).length === 2) {
                    var ids = Object.keys(pointers);
                    var a = pointers[ids[0]], c = pointers[ids[1]];
                    mode = 'pinch';
                    start = {
                      dist: Math.hypot(a.x - c.x, a.y - c.y) || 1,
                      rect: { x: rect.x, y: rect.y, w: rect.w, h: rect.h }
                    };
                  } else if (handle) {
                    mode = 'resize';
                    corner = handle.getAttribute('data-corner');
                    beginDrag(e);
                  } else {
                    mode = 'move';
                    beginDrag(e);
                  }
                  panel.classList.add('av-active');
                  e.preventDefault();
                });

                panel.addEventListener('pointermove', function (e) {
                  if (!mode || !pointers[e.pointerId]) return;
                  pointers[e.pointerId] = { x: e.clientX, y: e.clientY };

                  if (mode === 'pinch') {
                    var ids = Object.keys(pointers);
                    if (ids.length < 2) return;
                    var a = pointers[ids[0]], c = pointers[ids[1]];
                    var k = clamp(Math.hypot(a.x - c.x, a.y - c.y) / start.dist, 0.25, 6);
                    var s = start.rect;
                    var cx = s.x + s.w / 2, cy = s.y + s.h / 2;
                    var nw = clamp(s.w * k, 0.05, 1), nh = clamp(s.h * k, 0.05, 1);
                    rect.w = nw; rect.h = nh;
                    rect.x = clamp(cx - nw / 2, 0, 1 - nw);
                    rect.y = clamp(cy - nh / 2, 0, 1 - nh);
                  } else {
                    var dx = (e.clientX - start.x) / start.bw;
                    var dy = (e.clientY - start.y) / start.bh;
                    var r = start.rect;
                    if (mode === 'move') {
                      rect.x = clamp(r.x + dx, 0, 1 - r.w);
                      rect.y = clamp(r.y + dy, 0, 1 - r.h);
                    } else {
                      var minW = 0.05, minH = 0.05;
                      if (corner === 'br' || corner === 'tr') {
                        rect.w = clamp(r.w + dx, minW, 1 - r.x);
                      } else {
                        var right = r.x + r.w;
                        rect.x = clamp(r.x + dx, 0, right - minW);
                        rect.w = right - rect.x;
                      }
                      if (corner === 'br' || corner === 'bl') {
                        rect.h = clamp(r.h + dy, minH, 1 - r.y);
                      } else {
                        var bottom = r.y + r.h;
                        rect.y = clamp(r.y + dy, 0, bottom - minH);
                        rect.h = bottom - rect.y;
                      }
                    }
                  }
                  applyRect();
                  e.preventDefault();
                });

                function endPointer(e) {
                  delete pointers[e.pointerId];
                  if (!Object.keys(pointers).length) {
                    mode = null; corner = null;
                    panel.classList.remove('av-active');
                  }
                }
                panel.addEventListener('pointerup', endPointer);
                panel.addEventListener('pointercancel', endPointer);

                // ---- keyboard: arrows move, +/- scale (the tool has to work
                //      without a pointer too) ----
                panel.addEventListener('keydown', function (e) {
                  var step = e.shiftKey ? 0.05 : 0.01, used = true;
                  if (e.key === 'ArrowLeft') rect.x = clamp(rect.x - step, 0, 1 - rect.w);
                  else if (e.key === 'ArrowRight') rect.x = clamp(rect.x + step, 0, 1 - rect.w);
                  else if (e.key === 'ArrowUp') rect.y = clamp(rect.y - step, 0, 1 - rect.h);
                  else if (e.key === 'ArrowDown') rect.y = clamp(rect.y + step, 0, 1 - rect.h);
                  else if (e.key === '+' || e.key === '=') {
                    rect.w = clamp(rect.w + step, 0.05, 1 - rect.x);
                    rect.h = clamp(rect.h + step, 0.05, 1 - rect.y);
                  } else if (e.key === '-' || e.key === '_') {
                    rect.w = Math.max(0.05, rect.w - step);
                    rect.h = Math.max(0.05, rect.h - step);
                  } else used = false;
                  if (used) { hideHint(); applyRect(); e.preventDefault(); }
                });

                // ---- match the panel to the photo's exposure ----
                light.addEventListener('input', function () {
                  panel.style.setProperty('--av-light', (light.value / 100).toFixed(2));
                });

                document.getElementById('av-reset').addEventListener('click', function () {
                  setRoom(ROOMS[0], false);
                  upload.classList.remove('active');
                  selectStone(STONES[0]);
                  light.value = 100;
                  panel.style.setProperty('--av-light', '1');
                  layoutFrame();
                  hint.classList.remove('av-hidden');
                  hintTimer = setTimeout(hideHint, 6000);
                });
              })();
            </script>

            <style>
              html, body { height: 100%; margin: 0; }
              #akurock-visualizer {
                position: fixed; inset: 0; z-index: 999990;
                display: flex; flex-direction: column;
                height: 100dvh; max-height: 100dvh;
                background: #faf8f7; color: #0d0d0d;
                font-family: 'Inter', sans-serif;
                overscroll-behavior: none;
              }
              #akurock-visualizer *, #akurock-visualizer *::before, #akurock-visualizer *::after { box-sizing: border-box; }
              #akurock-visualizer .av-sr {
                position: absolute; width: 1px; height: 1px; overflow: hidden;
                clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
              }

              /* ---------- top bar ---------- */
              #akurock-visualizer .av-topbar {
                flex: none; display: grid; align-items: center; gap: 8px;
                grid-template-columns: 1fr auto 1fr;
                padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
              }
              #akurock-visualizer .av-title {
                font-weight: 600; letter-spacing: -0.02em; font-size: 17px; text-align: center;
              }
              #akurock-visualizer .av-back,
              #akurock-visualizer .av-cta {
                display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
                font-size: 14px; font-weight: 600; line-height: 1; padding: 11px 16px;
                border-radius: 999px; white-space: nowrap;
              }
              #akurock-visualizer .av-back {
                justify-self: start; background: #fff; color: #0d0d0d;
                border: 1px solid #e4ded8; box-shadow: 0 1px 3px rgba(0,0,0,.05);
              }
              #akurock-visualizer .av-cta {
                justify-self: end; background: #0d0d0d; color: #fff;
              }
              #akurock-visualizer .av-cta-arrow { opacity: .7; }
              #akurock-visualizer .av-back:hover, #akurock-visualizer .av-cta:hover { opacity: .85; }

              /* ---------- stage ---------- */
              #akurock-visualizer .av-stage-wrap {
                flex: 1 1 auto; min-height: 0; margin: 0 14px;
                display: flex; align-items: center; justify-content: center;
              }
              #akurock-visualizer .av-stage {
                position: relative; max-width: 100%; max-height: 100%;
                border-radius: 16px; overflow: hidden; background: #ece7e3;
                touch-action: none; box-shadow: 0 6px 24px rgba(13,13,13,.08);
              }
              #akurock-visualizer .av-room {
                position: absolute; inset: 0; width: 100%; height: 100%;
                object-fit: cover; user-select: none; -webkit-user-drag: none;
              }

              /* ---------- the panel: felt back + stone slats ---------- */
              #akurock-visualizer .av-panel {
                --av-tex: none; --av-light: 1;
                position: absolute; cursor: grab; touch-action: none; outline: none;
                box-shadow: 0 14px 34px rgba(0,0,0,.34), 0 2px 6px rgba(0,0,0,.22);

              #akurock-visualizer .av-panel.av-active { cursor: grabbing; }
              #akurock-visualizer .av-panel:focus-visible { box-shadow: 0 0 0 3px #f24616, 0 14px 34px rgba(0,0,0,.34); }
              #akurock-visualizer .av-slats {
                position: absolute; inset: 0; overflow: hidden;

              #akurock-visualizer .av-slat {

              /* light falls from the upper left in both demo rooms — a flat cut-out

              #akurock-visualizer .av-shade {
                position: absolute; inset: 0; pointer-events: none;
                background:
                  linear-gradient(100deg, rgba(255,255,255,.16), rgba(255,255,255,0) 45%, rgba(0,0,0,.10)),

              #akurock-visualizer .av-h-tl { left: -11px; top: -11px; cursor: nwse-resize; }
              #akurock-visualizer .av-h-tr { right: -11px; top: -11px; cursor: nesw-resize; }
              #akurock-visualizer .av-h-bl { left: -11px; bottom: -11px; cursor: nesw-resize; }
              #akurock-visualizer .av-h-br { right: -11px; bottom: -11px; cursor: nwse-resize; }

              #akurock-visualizer .av-hint {
                position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
                background: rgba(13,13,13,.78); color: #fff; font-size: 12.5px; font-weight: 500;
                padding: 9px 15px; border-radius: 999px; text-align: center;
                transition: opacity .35s, visibility .35s; pointer-events: none; max-width: calc(100% - 24px);
              }
              #akurock-visualizer .av-hint.av-hidden { opacity: 0; visibility: hidden; }

              /* ---------- dock ---------- */
              #akurock-visualizer .av-dock {

              #akurock-visualizer .av-picker {
                display: flex; gap: 14px; overflow-x: auto; padding: 2px 14px 10px;
                -webkit-overflow-scrolling: touch; scrollbar-width: none;
              }
              #akurock-visualizer .av-picker::-webkit-scrollbar { display: none; }
              #akurock-visualizer .av-swatch {
                flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px;
                border: none; background: none; cursor: pointer; padding: 0; font-family: inherit;
              }
              #akurock-visualizer .av-swatch-img {
                width: 52px; height: 52px; border-radius: 50%;

              #akurock-visualizer .av-swatch.active .av-swatch-img {
                box-shadow: 0 0 0 2px #faf8f7, 0 0 0 4px #f24616; transform: scale(1.04);

              #akurock-visualizer .av-swatch-name { font-size: 12px; font-weight: 600; color: #6b6660; }
              #akurock-visualizer .av-swatch.active .av-swatch-name { color: #0d0d0d; }

              #akurock-visualizer .av-controls {
                display: flex; align-items: center; gap: 10px; padding: 0 14px;
                border-top: 1px solid #ece6e0; padding-top: 12px;

              #akurock-visualizer .av-rooms { display: flex; gap: 8px; flex: none; }
              #akurock-visualizer .av-room-tile {
                width: 40px; height: 40px; border-radius: 10px; flex: none; cursor: pointer;
                background-size: cover; background-position: center; border: none; padding: 0;

              #akurock-visualizer .av-room-tile.active { box-shadow: 0 0 0 2px #f24616; }
              #akurock-visualizer .av-upload {

              #akurock-visualizer .av-light {

              #akurock-visualizer .av-icon-btn {

              #akurock-visualizer .av-icon-btn svg { width: 20px; height: 20px; }

                #akurock-visualizer .av-stage-wrap { margin: 0 10px; }

                #akurock-visualizer .av-swatch-img { width: 46px; height: 46px; }

    type="text/javascript" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0="
    crossorigin="anonymous"></script>
  <script src="/js/webflow.js" type="text/javascript"></script><!--  CUSTOM QUANTITY BUTTONS  -->
  <script>
    (globalThis.CodeCrumbs = globalThis.CodeCrumbs || {}).QuantityButtons = function (options) {
      // Optionen mit Standardwerten
      const {
        quantityGroupClass: groupClass = "q-group",
        quantityIncrementButtonClass: incClass = "q-inc",
        quantityDecrementButtonClass: decClass = "q-dec",
        quantityNumberFieldClass: numFieldClass = "q-num",
        disableDecrementAtOne: disableAtOne = true
      } = options;
      // Funktion zum Aktualisieren des Decrement-Buttons
      function updateDecrementButton(input, decButton) {
        const disable = disableAtOne && parseInt(input.value, 10) <= 1;
        decButton.toggleAttribute("disabled", disable);
        decButton.classList.toggle("disabled", disable);
      }
      // Initialisierungsfunktion
      function init() {
        document.querySelectorAll(`.${groupClass}`).forEach(group => {
          const input = group.querySelector(`.${numFieldClass}`);
          const decButton = group.querySelector(`.${decClass}`);
          if (input && decButton) {
            updateDecrementButton(input, decButton);
          }
        });
      }
      // Initialisierung beim Laden des Dokuments
      if (document.readyState !== "loading") {
        init();
      } else {
        document.addEventListener("DOMContentLoaded", init);
      }
      // Event Listener für Klicks (Event Delegation)
      document.addEventListener("click", function (event) {
        let target = event.target;
        // Suchen nach dem angeklickten Increment- oder Decrement-Button
        while (target && target.nodeType === Node.ELEMENT_NODE && (!target.classList || (!target.classList.contains(incClass) && !target.classList.contains(decClass)))) {
          target = target.parentNode;
        }
        if (target && target instanceof Element) {
          const group = target.closest(`.${groupClass}`);
          const input = group.querySelector(`.${numFieldClass}`);
          const decButton = group.querySelector(`.${decClass}`);
          let value = parseInt(input.value, 10);
          if (target.classList.contains(incClass)) {
            input.value = value + 1;
          } else if (target.classList.contains(decClass)) {
            input.value = Math.max(value - 1, 1);
          }
          updateDecrementButton(input, decButton);
          // Dispatch eines 'change'-Events
          input.dispatchEvent(new Event('change', { bubbles: true }));
        }
      });
      // MutationObserver zur Überwachung von Änderungen
      new MutationObserver((mutations) => {
        mutations.forEach(mutation => {
          if (mutation.type === "attributes" && mutation.attributeName === "value") {
            init();
          }
        });
      }).observe(document, {
        attributes: true,
        subtree: true,
        attributeFilter: ["value"]
      });
    };
    // Initialisierung der QuantityButtons
    document.addEventListener('DOMContentLoaded', function () {
      window.CodeCrumbs.QuantityButtons({
        quantityGroupClass: 'q-group',
        quantityIncrementButtonClass: 'q-inc',
        quantityDecrementButtonClass: 'q-dec',
        quantityNumberFieldClass: 'q-num',
        disableDecrementAtOne: true,
      });
    });
  </script>
