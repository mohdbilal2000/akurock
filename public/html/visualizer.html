            <script type="module">
              import * as THREE from '/js/three/three.module.min.js';

              const STONES = [
                { slug: 'whisper', name: 'Whisper', felt: '#b9b8bc' },
                { slug: 'brush',   name: 'Brush',   felt: '#cdcacc' },
                { slug: 'gaia',    name: 'Gaia',    felt: '#131313' },
                { slug: 'yami',    name: 'Yami',    felt: '#242628' },
                { slug: 'yuki',    name: 'Yuki',    felt: '#cdcbce' },
                { slug: 'ligia',   name: 'Ligia',   felt: '#191a1b' }
              ];
              const SCENES = [
                '/images/visualizer/room-bedroom.webp',
                '/images/visualizer/room-living.webp',
                '/images/visualizer/room-japandi.webp'
              ];
              // Real panel proportions: 42 mm slat on a 64 mm pitch, 23 mm deep.
              const SLAT_RATIO = 42 / 64;
              const DEPTH_RATIO = 23 / 64;
              const DEFAULT_PTS = [[0.22, 0.06], [0.78, 0.06], [0.78, 0.45], [0.22, 0.45]];
              const FACE_COLUMNS = 6;   // the face texture holds six slat strips

              const stage = document.getElementById('av-stage');
              const canvas = document.getElementById('av-canvas');
              const backdrop = document.getElementById('av-backdrop');
              const room = document.getElementById('av-room');
              const glCanvas = document.getElementById('av-gl');
              const light2d = document.getElementById('av-light');
              const outline = document.getElementById('av-outline');
              const shape = document.getElementById('av-outline-shape');
              const handlesBox = document.getElementById('av-handles');
              const picker = document.getElementById('av-picker');
              const scenes = document.getElementById('av-scenes');
              const hint = document.getElementById('av-hint');
              const pitchInput = document.getElementById('av-pitch');

              let pts = DEFAULT_PTS.map(p => p.slice());   // corners, normalised to the photo
              const handles = [];
              let stone = STONES[0];
              let slatCount = slatCountFor(pitchInput.value);

              function slatCountFor(v) {
                // The slider reads as slat width, so left (narrow) means more slats.
                const min = +pitchInput.min, max = +pitchInput.max;
                return min + max - +v;
              }

              /* ---------------- small linear algebra ---------------- */
              const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
              const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
              const scale = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
              const norm = a => Math.hypot(a[0], a[1], a[2]);
              const unit = a => scale(a, 1 / (norm(a) || 1e-9));
              const cross = (a, b) => [
                a[1] * b[2] - a[2] * b[1],
                a[2] * b[0] - a[0] * b[2],
                a[0] * b[1] - a[1] * b[0]
              ];

              // Homography mapping four source points onto four destination points.
              function homography(src, dst) {
                const A = [], b = [];
                for (let i = 0; i < 4; i++) {
                  const [x, y] = src[i], [u, v] = dst[i];
                  A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
                  A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
                }
                for (let i = 0; i < 8; i++) {                 // Gaussian elimination
                  let p = i;
                  for (let r = i + 1; r < 8; r++) if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
                  if (Math.abs(A[p][i]) < 1e-12) return null;
                  [A[i], A[p]] = [A[p], A[i]]; [b[i], b[p]] = [b[p], b[i]];
                  for (let r = 0; r < 8; r++) {
                    if (r === i) continue;
                    const k = A[r][i] / A[i][i];
                    if (!k) continue;
                    for (let c = i; c < 8; c++) A[r][c] -= k * A[i][c];
                    b[r] -= k * b[i];
                  }
                }
                const h = b.map((v, i) => v / A[i][i]);
                return [h[0], h[1], h[2], h[3], h[4], h[5], h[6], h[7], 1];
              }

              // Pose of the pinned rectangle: focal length from the right-angle
              // constraint, then plane rotation, translation and panel aspect.
              function poseFromQuad(quad, w, h) {
                const model = [[0, 0], [1, 0], [1, 1], [0, 1]];
                const H = homography(model, quad);
                if (!H) return null;
                const cx = w / 2, cy = h / 2;
                const h1 = [H[0], H[3], H[6]], h2 = [H[1], H[4], H[7]], h3 = [H[2], H[5], H[8]];
                const fallback = (h / 2) / Math.tan(THREE.MathUtils.degToRad(24));
                let f = fallback;
                const den = h1[2] * h2[2];
                if (Math.abs(den) > 1e-9) {
                  const f2 = -((h1[0] - cx * h1[2]) * (h2[0] - cx * h2[2]) +
                               (h1[1] - cy * h1[2]) * (h2[1] - cy * h2[2])) / den;
                  if (isFinite(f2) && f2 > 0) f = Math.sqrt(f2);
                }
                f = THREE.MathUtils.clamp(f, h * 0.45, h * 6);
                const K1 = v => [(v[0] - cx * v[2]) / f, (v[1] - cy * v[2]) / f, v[2]];
                const n1 = K1(h1), n2 = K1(h2), n3 = K1(h3);
                const l = 1 / (norm(n1) || 1e-9);
                const aspect = THREE.MathUtils.clamp(norm(n2) / (norm(n1) || 1e-9), 0.05, 20);
                let r1 = scale(n1, l);
                let r2 = scale(n2, l / aspect);
                r2 = unit(sub(r2, scale(r1, dot(r1, r2))));   // re-orthogonalise
                r1 = unit(r1);
                let r3 = cross(r1, r2);
                let t = scale(n3, l);
                if (t[2] < 0) { r1 = scale(r1, -1); r2 = scale(r2, -1); r3 = cross(r1, r2); t = scale(t, -1); }
                return { f, aspect, r1, r2, r3, t };
              }

              /* ---------------- three.js scene ---------------- */
              let renderer = null;
              try {
                renderer = new THREE.WebGLRenderer({ canvas: glCanvas, alpha: true, antialias: true });
              } catch (err) {
                stage.classList.add('is-flat');
              }
              const scene = new THREE.Scene();
              const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 200);
              const panel = new THREE.Group();
              // Soft contact shadow: a blurred rectangle on the wall, offset away
              // from the key light by the panel's own depth. The shadow map handles
              // the shadows *inside* the panel (slat on felt); this is the one the
              // panel throws onto the wall around it.
              function shadowTexture() {
                const c = document.createElement('canvas');
                c.width = c.height = 256;
                const ctx = c.getContext('2d');
                const pad = 46;
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, 256, 256);
                ctx.filter = 'blur(20px)';        // alphaMap reads the colour channel
                ctx.fillStyle = '#fff';
                ctx.fillRect(pad, pad, 256 - pad * 2, 256 - pad * 2);
                const tex = new THREE.CanvasTexture(c);
                tex.colorSpace = THREE.SRGBColorSpace;
                return tex;
              }
              const wallShadow = new THREE.Mesh(
                new THREE.PlaneGeometry(1, 1),
                new THREE.MeshBasicMaterial({
                  color: 0x000000, alphaMap: shadowTexture(), transparent: true,
                  opacity: 0.46, depthWrite: false, side: THREE.DoubleSide
                })
              );
              const keyLight = new THREE.DirectionalLight(0xffffff, 1);
              const fillLight = new THREE.HemisphereLight(0xffffff, 0x8d8378, 1);
              const loader = new THREE.TextureLoader();
              const faceTextures = new Map();
              let slats = [];
              let backing = null;

              if (renderer) {
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                renderer.outputColorSpace = THREE.SRGBColorSpace;
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                renderer.setClearAlpha(0);
                keyLight.castShadow = true;
                keyLight.shadow.mapSize.set(2048, 2048);
                keyLight.shadow.bias = -0.0006;
                keyLight.shadow.normalBias = 0.012;
                scene.add(panel, fillLight, keyLight, keyLight.target);
                panel.add(wallShadow);
              }

              function faceTexture(slug) {
                if (!faceTextures.has(slug)) {
                  const tex = loader.load('/images/visualizer/face-' + slug + '.webp', () => {
                    panel.userData = {};        // rebuild so the slats pick the texture up
                    requestRender();
                  });
                  tex.colorSpace = THREE.SRGBColorSpace;
                  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
                  tex.anisotropy = renderer ? renderer.capabilities.getMaxAnisotropy() : 1;
                  faceTextures.set(slug, tex);
                }
                return faceTextures.get(slug);
              }

              // Rebuild the slats. Model space: x 0..1 across the panel, y 0..aspect
              // down it, z out of the wall — the same space the pose maps from.
              function buildPanel(aspect, dirSign) {
                slats.forEach(m => {
                  m.geometry.dispose();
                  m.material.forEach(mat => { if (mat.map) mat.map.dispose(); mat.dispose(); });
                  panel.remove(m);
                });
                slats = [];
                if (backing) { backing.geometry.dispose(); backing.material.dispose(); panel.remove(backing); }

                const felt = new THREE.Color(stone.felt);
                const feltLum = 0.2126 * felt.r + 0.7152 * felt.g + 0.0722 * felt.b;
                const pitch = 1 / slatCount;
                const width = pitch * SLAT_RATIO;
                const depth = pitch * DEPTH_RATIO;

                backing = new THREE.Mesh(
                  new THREE.PlaneGeometry(1, aspect),
                  new THREE.MeshStandardMaterial({ color: felt.clone().multiplyScalar(feltLum > 0.45 ? 0.5 : 0.34), roughness: 1 })
                );
                backing.material.side = THREE.DoubleSide;
                backing.position.set(0.5, aspect / 2, 0);
                backing.receiveShadow = true;
                panel.add(backing);

                const core = new THREE.MeshStandardMaterial({
                  color: felt.clone().multiplyScalar(0.55), roughness: 0.95
                });
                const tex = faceTexture(stone.slug);
                const ready = !!(tex.image && tex.image.width);
                for (let i = 0; i < slatCount; i++) {
                  let face;
                  if (ready) {
                    const map = tex.clone();
                    map.needsUpdate = true;
                    map.repeat.set(1 / FACE_COLUMNS, Math.max(1, Math.round(aspect / 1.6)));
                    map.offset.set((i % FACE_COLUMNS) / FACE_COLUMNS, (i * 0.37) % 1);
                    face = new THREE.MeshStandardMaterial({
                      map, roughness: 0.94, metalness: 0,
                      bumpMap: map, bumpScale: 0.0018
                    });
                  } else {
                    face = new THREE.MeshStandardMaterial({ color: felt.clone().lerp(new THREE.Color(0xffffff), 0.35), roughness: 0.94 });
                  }
                  // BoxGeometry material order: +x, -x, +y, -y, +z, -z. The slats
                  // stand off whichever side of the plane faces the camera, so the
                  // stone face goes on both z faces and only one is ever seen.
                  const slat = new THREE.Mesh(
                    new THREE.BoxGeometry(width, aspect, depth),
                    [core, core, core, core, face, face]
                  );
                  slat.position.set(pitch * (i + 0.5), aspect / 2, dirSign * depth / 2);
                  slat.castShadow = true;
                  slat.receiveShadow = true;
                  panel.add(slat);
                  slats.push(slat);
                }

                const bleed = 16 * depth;     // matches the blur baked into the texture
                wallShadow.geometry.dispose();
                wallShadow.geometry = new THREE.PlaneGeometry(1 + bleed, aspect + bleed);
                wallShadow.renderOrder = -1;
                wallShadow.position.set(0.5, aspect / 2, dirSign * 0.0006);
                panel.userData.depth = depth;
              }

              /* ---------------- light rig estimated from the photo ---------------- */
              let lightRig = { dir: [0.35, -0.45, 1], key: 1.1, ambient: 0.9, sky: 0xffffff, ground: 0x8d8378 };
              function analysePhoto() {
                if (!room.naturalWidth) return;
                const c = document.createElement('canvas');
                c.width = 48; c.height = 48;
                const ctx = c.getContext('2d', { willReadFrequently: true });
                let data;
                try {
                  ctx.drawImage(room, 0, 0, 48, 48);
                  data = ctx.getImageData(0, 0, 48, 48).data;
                } catch (err) { return; }   // tainted canvas: keep the defaults
                let sum = 0, top = [0, 0, 0], bottom = [0, 0, 0], best = -1, bx = 24, by = 12, wsum = 0, cxw = 0, cyw = 0;
                for (let y = 0; y < 48; y++) for (let x = 0; x < 48; x++) {
                  const i = (y * 48 + x) * 4;
                  const r = data[i] / 255, g = data[i + 1] / 255, b = data[i + 2] / 255;
                  const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                  sum += lum;
                  const bin = y < 16 ? top : (y > 31 ? bottom : null);
                  if (bin) { bin[0] += r; bin[1] += g; bin[2] += b; }
                  if (lum > best) { best = lum; bx = x; by = y; }
                  const w = Math.pow(lum, 6);          // pull towards the bright areas
                  wsum += w; cxw += w * x; cyw += w * y;
                }
                const mean = sum / (48 * 48);
                // three's lights are in physical units: a surface facing a light of
                // intensity I reflects albedo * I / PI, so aim for a target
                // irradiance and split it between ambient and key by the photo's
                // own contrast.
                const contrast = THREE.MathUtils.clamp((best - mean) / (mean + 0.15), 0.12, 0.9);
                const target = THREE.MathUtils.clamp(mean * 1.45 + 0.14, 0.28, 1.4);
                const keyShare = 0.24 + 0.42 * contrast;
                const hx = wsum ? cxw / wsum : bx, hy = wsum ? cyw / wsum : by;
                let px = (hx / 48) * 2 - 1, py = (hy / 48) * 2 - 1;
                if (Math.hypot(px, py) < 0.35) { px = px * 0.4 + 0.42; py = py * 0.4 - 0.5; }
                lightRig = {
                  dir: [px * 1.5, py * 1.5, 1.15],
                  key: Math.PI * target * keyShare,
                  ambient: Math.PI * target * (1 - keyShare),
                  sky: new THREE.Color(top[0] / 768, top[1] / 768, top[2] / 768).getHex(),
                  ground: new THREE.Color(bottom[0] / 768, bottom[1] / 768, bottom[2] / 768).getHex()
                };
              }

              /* ---------------- rendering ---------------- */
              function fitCanvas() {
                const r = stage.getBoundingClientRect();
                const pad = 22;                       // keeps corner handles reachable
                const maxW = Math.max(40, r.width - pad * 2);
                const maxH = Math.max(40, r.height - pad * 2);
                const ar = (room.naturalWidth && room.naturalHeight)
                  ? room.naturalWidth / room.naturalHeight : 1;
                let w = maxW, h = w / ar;
                if (h > maxH) { h = maxH; w = h * ar; }
                canvas.style.width = Math.round(w) + 'px';
                canvas.style.height = Math.round(h) + 'px';
              }
              function canvasSize() {
                const r = canvas.getBoundingClientRect();
                return [r.width, r.height];
              }
              function pixels() {
                const [w, h] = canvasSize();
                return pts.map(p => [p[0] * w, p[1] * h]);
              }

              let queued = false;
              function requestRender() {
                if (queued) return;
                queued = true;
                requestAnimationFrame(() => { queued = false; draw(); });
              }

              function draw() {
                fitCanvas();
                const px = pixels();
                const [w, h] = canvasSize();

                const poly = px.map(p => p[0].toFixed(1) + 'px ' + p[1].toFixed(1) + 'px').join(',');
                light2d.style.clipPath = 'polygon(' + poly + ')';
                light2d.style.webkitClipPath = 'polygon(' + poly + ')';
                shape.setAttribute('points', px.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '));
                outline.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
                handles.forEach((el, i) => {
                  el.style.left = px[i][0] + 'px';
                  el.style.top = px[i][1] + 'px';
                });
                if (!renderer || w < 2 || h < 2) return;

                const pose = poseFromQuad(px, w, h);
                if (!pose) return;
                // Extrude off the side of the wall plane that faces the camera.
                const dirSign = dot(pose.r3, pose.t) < 0 ? 1 : -1;
                if (!slats.length || Math.abs(panel.userData.aspect - pose.aspect) > 0.004 ||
                    panel.userData.slug !== stone.slug || panel.userData.slats !== slatCount ||
                    panel.userData.dir !== dirSign) {
                  buildPanel(pose.aspect, dirSign);
                  panel.userData = { aspect: pose.aspect, slug: stone.slug, slats: slatCount, dir: dirSign };
                }

                // OpenCV pose -> three.js (y and z flipped).
                const { r1, r2, r3, t } = pose;
                panel.matrixAutoUpdate = false;
                panel.matrix.set(
                   r1[0],  r2[0],  r3[0],  t[0],
                  -r1[1], -r2[1], -r3[1], -t[1],
                  -r1[2], -r2[2], -r3[2], -t[2],
                       0,      0,      0,     1
                );
                panel.matrixWorldNeedsUpdate = true;

                camera.fov = 2 * Math.atan((h / 2) / pose.f) * 180 / Math.PI;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();

                const centre = new THREE.Vector3(0.5, pose.aspect / 2, 0).applyMatrix4(panel.matrix);
                const d = unit(lightRig.dir);
                {
                  // Light direction expressed in the wall's own axes.
                  const lx = d[0] * pose.r1[0] + (-d[1]) * pose.r1[1] + d[2] * pose.r1[2];
                  const ly = d[0] * pose.r2[0] + (-d[1]) * pose.r2[1] + d[2] * pose.r2[2];
                  const ln = Math.abs(d[0] * pose.r3[0] + (-d[1]) * pose.r3[1] + d[2] * pose.r3[2]);
                  const dep = panel.userData.depth || 0.02;
                  const k = Math.min(0.14, 2.4 * dep / Math.max(ln, 0.25));
                  wallShadow.position.x = 0.5 - lx * k;
                  wallShadow.position.y = pose.aspect / 2 - ly * k;
                }
                keyLight.position.set(centre.x + d[0] * 4, centre.y - d[1] * 4, centre.z + d[2] * 4);
                keyLight.target.position.copy(centre);
                keyLight.target.updateMatrixWorld();
                keyLight.intensity = lightRig.key;
                keyLight.color.setHex(lightRig.sky);
                const span = 0.62 * Math.max(1 + 0.5, pose.aspect + 0.5) + 0.25;
                const s = keyLight.shadow.camera;
                s.left = -span; s.right = span; s.top = span; s.bottom = -span;
                s.near = 0.1; s.far = 14;
                s.updateProjectionMatrix();
                fillLight.intensity = lightRig.ambient;
                fillLight.color.setHex(lightRig.sky);
                fillLight.groundColor.setHex(lightRig.ground);

                renderer.setSize(w, h, false);
                renderer.render(scene, camera);
              }

              /* ---------------- controls ---------------- */
              function setRoom(src) {
                room.src = src;
                light2d.style.backgroundImage = 'url("' + src + '")';
                backdrop.style.backgroundImage = 'url("' + src + '")';
              }
              function selectStone(next, btn) {
                stone = next;
                Array.from(picker.children).forEach(c => c.classList.remove('is-active'));
                if (btn) btn.classList.add('is-active');
                requestRender();
              }

              STONES.forEach((s, i) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'av-swatch';
                b.innerHTML =
                  '<span class="av-swatch-img" style="background-image:url(\'/images/visualizer/swatch-' + s.slug + '.webp\')"></span>' +
                  '<span class="av-swatch-name">' + s.name + '</span>';
                b.addEventListener('click', () => selectStone(s, b));
                picker.appendChild(b);
                if (i === 0) b.classList.add('is-active');
              });

              SCENES.forEach((src, i) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'av-scene' + (i === 0 ? ' is-active' : '');
                b.setAttribute('aria-label', 'Raum ' + (i + 1));
                b.style.backgroundImage = 'url("' + src + '")';
                b.addEventListener('click', () => {
                  setRoom(src);
                  Array.from(scenes.children).forEach(c => c.classList.remove('is-active'));
                  b.classList.add('is-active');
                });
                scenes.appendChild(b);
              });

              for (let i = 0; i < 4; i++) {
                const el = document.createElement('button');
                el.type = 'button';
                el.className = 'av-handle';
                el.dataset.index = String(i);
                el.setAttribute('aria-label', 'Ecke ' + (i + 1));
                handlesBox.appendChild(el);
                handles.push(el);
              }

              pitchInput.addEventListener('input', () => {
                slatCount = slatCountFor(pitchInput.value);
                requestRender();
              });

              document.getElementById('av-file').addEventListener('change', e => {
                const f = e.target.files && e.target.files[0];
                if (!f) return;
                setRoom(URL.createObjectURL(f));
                Array.from(scenes.children).forEach(c => c.classList.remove('is-active'));
              });

              document.getElementById('av-reset').addEventListener('click', () => {
                pts = DEFAULT_PTS.map(p => p.slice());
                pitchInput.value = 26;
                slatCount = slatCountFor(26);
                setRoom(SCENES[0]);
                Array.from(scenes.children).forEach((c, i) => c.classList.toggle('is-active', i === 0));
                stage.classList.remove('is-active');
                hint.classList.remove('is-hidden');
                requestRender();
              });

              document.getElementById('av-save').addEventListener('click', () => {
                const [w, h] = canvasSize();
                const out = document.createElement('canvas');
                const scaleUp = Math.min(2, Math.max(1, (room.naturalWidth || w) / w));
                out.width = Math.round(w * scaleUp);
                out.height = Math.round(h * scaleUp);
                const ctx = out.getContext('2d');
                draw();
                ctx.drawImage(room, 0, 0, out.width, out.height);
                if (renderer) ctx.drawImage(glCanvas, 0, 0, out.width, out.height);
                out.toBlob(blob => {
                  if (!blob) return;
                  const a = document.createElement('a');
                  a.href = URL.createObjectURL(blob);
                  a.download = 'akurock-visualizer.png';
                  a.click();
                  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
                }, 'image/png');
              });

              /* ---------------- generative render ----------------
                 The three.js pass above stops being the output here. It becomes
                 the control signal: the server sends it to an image model
                 alongside the photo, so the model gets the panel's real slat
                 pitch and perspective instead of inventing a product. */
              const generateBtn = document.getElementById('av-generate');
              const busy = document.getElementById('av-busy');
              const busyText = document.getElementById('av-busy-text');
              const resultBox = document.getElementById('av-result');
              const resultImg = document.getElementById('av-result-img');
              const resultToggle = document.getElementById('av-result-toggle');
              let sceneAnalysis = null;
              let analysedSrc = null;      // which photo sceneAnalysis describes
              let maskMode = 'white-paint';
              let busyState = false;
              let showingBefore = false;

              // Long edge the photo is sent at. Big enough for the model to
              // resolve slats, small enough to keep the request under the
              // route's size cap and the round-trip bearable on mobile data.
              const SEND_EDGE = 1280;

              function photoCanvas() {
                const nw = room.naturalWidth || 1, nh = room.naturalHeight || 1;
                const k = Math.min(1, SEND_EDGE / Math.max(nw, nh));
                const c = document.createElement('canvas');
                c.width = Math.max(1, Math.round(nw * k));
                c.height = Math.max(1, Math.round(nh * k));
                c.getContext('2d').drawImage(room, 0, 0, c.width, c.height);
                return c;
              }

              function polygonPath(ctx, w, h) {
                ctx.beginPath();
                pts.forEach((p, i) => {
                  const x = p[0] * w, y = p[1] * h;
                  if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                });
                ctx.closePath();
              }

              function controlDataUrl(w, h) {
                const c = document.createElement('canvas');
                c.width = w; c.height = h;
                const ctx = c.getContext('2d');
                draw();
                ctx.drawImage(room, 0, 0, w, h);
                if (renderer) ctx.drawImage(glCanvas, 0, 0, w, h);
                return c.toDataURL('image/png');
              }

              function maskDataUrl(w, h) {
                const c = document.createElement('canvas');
                c.width = w; c.height = h;
                const ctx = c.getContext('2d');
                if (maskMode === 'alpha-hole') {
                  // Repaint where the mask is transparent.
                  ctx.fillStyle = '#000';
                  ctx.fillRect(0, 0, w, h);
                  ctx.globalCompositeOperation = 'destination-out';
                  polygonPath(ctx, w, h);
                  ctx.fill();
                } else {
                  // Repaint where the mask is white.
                  ctx.fillStyle = '#000';
                  ctx.fillRect(0, 0, w, h);
                  ctx.fillStyle = '#fff';
                  polygonPath(ctx, w, h);
                  ctx.fill();
                }
                return c.toDataURL('image/png');
              }

              function setBusy(on, text) {
                busyState = on;
                busy.hidden = !on;
                if (text) busyText.textContent = text;
                generateBtn.disabled = on;
                generateBtn.classList.toggle('is-busy', on);
              }

              function failGenerate(message) {
                setBusy(false);
                hint.textContent = message;
                hint.classList.remove('is-hidden');
              }

              /* Place the panel on the wall Claude found, so the visitor never
                 has to drag corners to get a plausible starting point. */
              function applyAnalysis(a) {
                if (!a || !a.wall || !Array.isArray(a.wall.corners)) return;
                if (a.wall.corners.length !== 4 || a.wall.confidence < 0.35) return;
                const c = a.wall.corners.map(p => [clamp01(p.x), clamp01(p.y)]);
                // Inset to about 70% of the wall — a panel rarely covers it all.
                const cx = c.reduce((t, p) => t + p[0], 0) / 4;
                const cy = c.reduce((t, p) => t + p[1], 0) / 4;
                pts = c.map(p => [cx + (p[0] - cx) * 0.7, cy + (p[1] - cy) * 0.7]);
                requestRender();
              }

              async function ensureAnalysis(photo) {
                if (sceneAnalysis && analysedSrc === room.currentSrc) return sceneAnalysis;
                setBusy(true, 'Raum wird gelesen …');
                const res = await fetch('/api/visualizer/analyze', {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({ image: photo, locale: document.documentElement.lang || 'de' })
                });
                const json = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error('Render fehlgeschlagen.');
                if (json.analysis && json.analysis.rejectionReason) {
                  const err = new Error(json.analysis.rejectionReason);
                  err.fromModel = true;   // already in the visitor's language
                  throw err;
                }
                sceneAnalysis = json.analysis;
                analysedSrc = room.currentSrc;
                if (json.maskConvention) maskMode = json.maskConvention;
                applyAnalysis(sceneAnalysis);
                return sceneAnalysis;
              }

              async function generate() {
                if (busyState) return;
                let photo;
                try {
                  photo = photoCanvas().toDataURL('image/jpeg', 0.92);
                } catch (err) {
                  // A cross-origin photo taints the canvas and cannot be read out.
                  failGenerate('Dieses Foto kann nicht gerendert werden.');
                  return;
                }
                try {
                  const analysis = await ensureAnalysis(photo);
                  const c = photoCanvas();
                  setBusy(true, 'Paneel wird gerendert …');
                  const res = await fetch('/api/visualizer/render', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({
                      roomImage: photo,
                      controlImage: controlDataUrl(c.width, c.height),
                      maskImage: maskDataUrl(c.width, c.height),
                      stone: stone.name,
                      analysis: analysis
                    })
                  });
                  const json = await res.json().catch(() => ({}));
                  if (!res.ok || !json.image) throw new Error('Render fehlgeschlagen.');
                  resultImg.src = json.image;
                  showingBefore = false;
                  resultToggle.textContent = 'Vorher';
                  resultBox.hidden = false;
                  setBusy(false);
                } catch (err) {
                  failGenerate(err && err.fromModel && err.message
                    ? err.message
                    : 'Render fehlgeschlagen.');
                }
              }

              generateBtn.addEventListener('click', generate);

              resultToggle.addEventListener('click', () => {
                showingBefore = !showingBefore;
                resultImg.style.visibility = showingBefore ? 'hidden' : '';
                resultToggle.textContent = showingBefore ? 'Nachher' : 'Vorher';
              });

              document.getElementById('av-result-close').addEventListener('click', () => {
                resultBox.hidden = true;
                resultImg.removeAttribute('src');
              });

              document.getElementById('av-result-save').addEventListener('click', () => {
                if (!resultImg.src) return;
                const a = document.createElement('a');
                a.href = resultImg.src;
                a.download = 'akurock-visualizer.png';
                a.click();
              });

              /* A new photo invalidates the analysis. */
              room.addEventListener('load', () => {
                sceneAnalysis = null;
                analysedSrc = null;
                resultBox.hidden = true;
              });

              /* ---------------- interaction ---------------- */
              const pointers = new Map();
              let gesture = null;
              let idleTimer = null;
              const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;

              function local(e) {
                const r = canvas.getBoundingClientRect();
                return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
              }
              function inside(p) {
                let hit = false;
                for (let i = 0, j = 3; i < 4; j = i++) {
                  const a = pts[i], b = pts[j];
                  if ((a[1] > p[1]) !== (b[1] > p[1]) &&
                      p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) hit = !hit;
                }
                return hit;
              }
              const snapshot = () => pts.map(p => p.slice());
              function activate() {
                stage.classList.add('is-active');
                hint.classList.add('is-hidden');
                clearTimeout(idleTimer);
              }
              function deactivate() {
                clearTimeout(idleTimer);
                idleTimer = setTimeout(() => stage.classList.remove('is-active'), 1400);
              }

              canvas.addEventListener('pointerdown', e => {
                const p = local(e);
                const idx = e.target.classList && e.target.classList.contains('av-handle')
                  ? +e.target.dataset.index : -1;
                if (idx < 0 && !inside(p)) return;
                pointers.set(e.pointerId, p);
                canvas.setPointerCapture(e.pointerId);
                activate();
                e.preventDefault();
                const list = [...pointers.values()];
                if (list.length >= 2) gesture = { type: 'pinch', start: list.slice(0, 2).map(q => q.slice()), pts: snapshot() };
                else if (idx >= 0) gesture = { type: 'corner', index: idx, pts: snapshot() };
                else gesture = { type: 'move', start: p, pts: snapshot() };
              });

              canvas.addEventListener('pointermove', e => {
                if (!pointers.has(e.pointerId) || !gesture) return;
                pointers.set(e.pointerId, local(e));
                const list = [...pointers.values()];

                if (gesture.type === 'corner') {
                  const p = pointers.get(e.pointerId);
                  pts[gesture.index] = [clamp01(p[0]), clamp01(p[1])];
                } else if (gesture.type === 'move') {
                  const q = pointers.get(e.pointerId);
                  let dx = q[0] - gesture.start[0], dy = q[1] - gesture.start[1];
                  const xs = gesture.pts.map(c => c[0]), ys = gesture.pts.map(c => c[1]);
                  dx = Math.max(-Math.min(...xs), Math.min(dx, 1 - Math.max(...xs)));
                  dy = Math.max(-Math.min(...ys), Math.min(dy, 1 - Math.max(...ys)));
                  pts = gesture.pts.map(c => [c[0] + dx, c[1] + dy]);
                } else if (gesture.type === 'pinch' && list.length >= 2) {
                  const [a0, b0] = gesture.start, [a1, b1] = list;
                  const d0 = Math.hypot(b0[0] - a0[0], b0[1] - a0[1]) || 1e-6;
                  const d1 = Math.hypot(b1[0] - a1[0], b1[1] - a1[1]);
                  const k = Math.max(0.2, Math.min(4, d1 / d0));
                  const c0 = [(a0[0] + b0[0]) / 2, (a0[1] + b0[1]) / 2];
                  const c1 = [(a1[0] + b1[0]) / 2, (a1[1] + b1[1]) / 2];
                  pts = gesture.pts.map(c => [
                    clamp01(c1[0] + (c[0] - c0[0]) * k),
                    clamp01(c1[1] + (c[1] - c0[1]) * k)
                  ]);
                }
                requestRender();
              });

              function endPointer(e) {
                pointers.delete(e.pointerId);
                if (!pointers.size) { gesture = null; deactivate(); }
                else if (gesture && gesture.type === 'pinch') gesture = null;
              }
              canvas.addEventListener('pointerup', endPointer);
              canvas.addEventListener('pointercancel', endPointer);

              handlesBox.addEventListener('keydown', e => {
                const i = e.target.dataset && e.target.dataset.index;
                if (i === undefined) return;
                const step = e.shiftKey ? 0.05 : 0.01;
                const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
                if (!d) return;
                e.preventDefault();
                const idx = +i;
                pts[idx] = [clamp01(pts[idx][0] + d[0]), clamp01(pts[idx][1] + d[1])];
                activate();
                deactivate();
                requestRender();
              });

              room.addEventListener('load', () => { analysePhoto(); requestRender(); });
              window.addEventListener('resize', requestRender);
              if (window.ResizeObserver) new ResizeObserver(requestRender).observe(stage);
              if (room.complete) analysePhoto();
              setRoom(SCENES[0]);
              requestRender();

              window.setTimeout(() => {
                STONES.forEach(s => { new Image().src = '/images/visualizer/face-' + s.slug + '.webp'; });
                SCENES.forEach(s => { new Image().src = s; });
              }, 1500);
            </script>

              #akurock-visualizer .av-ghost:hover { border-color: #0d0d0d; opacity: 1; }

                touch-action: none; box-shadow: 0 20px 50px rgba(13,13,13,.28);

    type="text/javascript" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0="
    crossorigin="anonymous"></script>
  <script src="/js/webflow.js" type="text/javascript"></script><!--  CUSTOM QUANTITY BUTTONS  -->
  <script>
    (globalThis.CodeCrumbs = globalThis.CodeCrumbs || {}).QuantityButtons = function (options) {
      // Optionen mit Standardwerten
      const {
        quantityGroupClass: groupClass = "q-group",
        quantityIncrementButtonClass: incClass = "q-inc",
        quantityDecrementButtonClass: decClass = "q-dec",
        quantityNumberFieldClass: numFieldClass = "q-num",
        disableDecrementAtOne: disableAtOne = true
      } = options;
      // Funktion zum Aktualisieren des Decrement-Buttons
      function updateDecrementButton(input, decButton) {
        const disable = disableAtOne && parseInt(input.value, 10) <= 1;
        decButton.toggleAttribute("disabled", disable);
        decButton.classList.toggle("disabled", disable);
      }
      // Initialisierungsfunktion
      function init() {
        document.querySelectorAll(`.${groupClass}`).forEach(group => {
          const input = group.querySelector(`.${numFieldClass}`);
          const decButton = group.querySelector(`.${decClass}`);
          if (input && decButton) {
            updateDecrementButton(input, decButton);
          }
        });
      }
      // Initialisierung beim Laden des Dokuments
      if (document.readyState !== "loading") {
        init();
      } else {
        document.addEventListener("DOMContentLoaded", init);
      }
      // Event Listener für Klicks (Event Delegation)
      document.addEventListener("click", function (event) {
        let target = event.target;
        // Suchen nach dem angeklickten Increment- oder Decrement-Button
        while (target && target.nodeType === Node.ELEMENT_NODE && (!target.classList || (!target.classList.contains(incClass) && !target.classList.contains(decClass)))) {
          target = target.parentNode;
        }
        if (target && target instanceof Element) {
          const group = target.closest(`.${groupClass}`);
          const input = group.querySelector(`.${numFieldClass}`);
          const decButton = group.querySelector(`.${decClass}`);
          let value = parseInt(input.value, 10);
          if (target.classList.contains(incClass)) {
            input.value = value + 1;
          } else if (target.classList.contains(decClass)) {
            input.value = Math.max(value - 1, 1);
          }
          updateDecrementButton(input, decButton);
          // Dispatch eines 'change'-Events
          input.dispatchEvent(new Event('change', { bubbles: true }));
        }
      });
      // MutationObserver zur Überwachung von Änderungen
      new MutationObserver((mutations) => {
        mutations.forEach(mutation => {
          if (mutation.type === "attributes" && mutation.attributeName === "value") {
            init();
          }
        });
      }).observe(document, {
        attributes: true,
        subtree: true,
        attributeFilter: ["value"]
      });
    };
    // Initialisierung der QuantityButtons
    document.addEventListener('DOMContentLoaded', function () {
      window.CodeCrumbs.QuantityButtons({
        quantityGroupClass: 'q-group',
        quantityIncrementButtonClass: 'q-inc',
        quantityDecrementButtonClass: 'q-dec',
        quantityNumberFieldClass: 'q-num',
        disableDecrementAtOne: true,
      });
    });
  </script>
