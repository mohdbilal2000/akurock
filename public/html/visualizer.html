          <div class="w-embed">
            <!-- AKUROCK VISUALIZER — self-hosted (replaces the expired Wizart

                 photo instead of floating on top of it. No third-party
                 dependency. On-brand: Inter, #faf8f7 / #0d0d0d / #f24616. -->
            <div id="akurock-visualizer">
              <div class="av-topbar">
                <div class="av-title">Visualizer</div>
                <div class="av-actions">
                  <label class="av-btn av-solid" aria-label="Eigenes Raumfoto">

                  </label>

                  </button>
                </div>
              </div>

              <div class="av-stage" id="av-stage">
                <div class="av-backdrop" id="av-backdrop"></div>
                <div class="av-canvas" id="av-canvas">
                  <div class="av-frame">

                    <div class="av-quad" id="av-quad">

                </div>

              </div>

              <div class="av-dock">
                <div class="av-picker" id="av-picker"><!-- stone swatches injected by JS --></div>
                <div class="av-tools">
                  <div class="av-scenes" id="av-scenes"><!-- room scenes injected by JS --></div>
                  <label class="av-range">
                    <span class="av-range-label">Lamellenbreite</span>
                    <input id="av-pitch" type="range" min="26" max="90" step="1" value="52">
                  </label>
                </div>
              </div>

            <script>
              (function () {
                var STONES = [
                  { slug: 'whisper', name: 'Whisper' },
                  { slug: 'brush',   name: 'Brush' },
                  { slug: 'gaia',    name: 'Gaia' },
                  { slug: 'yami',    name: 'Yami' },
                  { slug: 'yuki',    name: 'Yuki' },
                  { slug: 'ligia',   name: 'Ligia' }
                ];
                var SCENES = [
                  '/images/visualizer/room-bedroom.webp',
                  '/images/visualizer/room-living.webp',
                  '/images/visualizer/room-japandi.webp'
                ];
                // The textured quad is authored in a fixed 1000x1000 coordinate
                // space and then mapped onto the four draggable corners, so the
                // slat width stays independent of the panel's screen size.
                var BASE = 1000;
                var DEFAULT_PTS = [[0.22, 0.06], [0.78, 0.06], [0.78, 0.45], [0.22, 0.45]];

                var stage = document.getElementById('av-stage');
                var canvas = document.getElementById('av-canvas');
                var backdrop = document.getElementById('av-backdrop');
                var room = document.getElementById('av-room');
                var quad = document.getElementById('av-quad');
                var fill = document.getElementById('av-fill');
                var light = document.getElementById('av-light');
                var outline = document.getElementById('av-outline');
                var shape = document.getElementById('av-outline-shape');
                var handlesBox = document.getElementById('av-handles');
                var picker = document.getElementById('av-picker');
                var scenes = document.getElementById('av-scenes');
                var hint = document.getElementById('av-hint');
                var pitchInput = document.getElementById('av-pitch');

                // Corners in normalised stage coordinates: TL, TR, BR, BL.
                var pts = DEFAULT_PTS.map(function (p) { return [p[0], p[1]]; });
                var handles = [];

                // ---------- projective mapping (square -> quad) ----------
                function adj(m) {
                  return [
                    m[4] * m[8] - m[5] * m[7], m[2] * m[7] - m[1] * m[8], m[1] * m[5] - m[2] * m[4],
                    m[5] * m[6] - m[3] * m[8], m[0] * m[8] - m[2] * m[6], m[2] * m[3] - m[0] * m[5],
                    m[3] * m[7] - m[4] * m[6], m[1] * m[6] - m[0] * m[7], m[0] * m[4] - m[1] * m[3]
                  ];
                }
                function mulmm(a, b) {
                  var c = [], i, j, k, s;
                  for (i = 0; i < 3; i++) for (j = 0; j < 3; j++) {
                    for (s = 0, k = 0; k < 3; k++) s += a[3 * i + k] * b[3 * k + j];
                    c[3 * i + j] = s;
                  }
                  return c;
                }
                function mulmv(m, v) {
                  return [
                    m[0] * v[0] + m[1] * v[1] + m[2] * v[2],
                    m[3] * v[0] + m[4] * v[1] + m[5] * v[2],
                    m[6] * v[0] + m[7] * v[1] + m[8] * v[2]
                  ];
                }
                function basis(p) {
                  var m = [p[0][0], p[1][0], p[2][0], p[0][1], p[1][1], p[2][1], 1, 1, 1];
                  var v = mulmv(adj(m), [p[3][0], p[3][1], 1]);
                  return mulmm(m, [v[0], 0, 0, 0, v[1], 0, 0, 0, v[2]]);
                }
                function transformFor(dest) {
                  var src = [[0, 0], [BASE, 0], [BASE, BASE], [0, BASE]];
                  var t = mulmm(basis(dest), adj(basis(src)));
                  for (var i = 0; i < 9; i++) t[i] = t[i] / t[8];
                  return 'matrix3d(' + [
                    t[0], t[3], 0, t[6],
                    t[1], t[4], 0, t[7],
                    0, 0, 1, 0,
                    t[2], t[5], 0, t[8]
                  ].join(',') + ')';
                }

                // ---------- rendering ----------
                // The photo is fitted (never cropped) inside the stage, and the
                // panel lives in the photo's own coordinate space.
                function fitCanvas() {
                  var r = stage.getBoundingClientRect();
                  var pad = 22;   // keeps corner handles reachable at the edges
                  var maxW = Math.max(40, r.width - pad * 2);
                  var maxH = Math.max(40, r.height - pad * 2);
                  var ar = (room.naturalWidth && room.naturalHeight)
                    ? room.naturalWidth / room.naturalHeight : 1;
                  var w = maxW, h = w / ar;
                  if (h > maxH) { h = maxH; w = h * ar; }
                  canvas.style.width = Math.round(w) + 'px';
                  canvas.style.height = Math.round(h) + 'px';
                }
                function stageSize() {
                  var r = canvas.getBoundingClientRect();
                  return [r.width, r.height];
                }
                function pixels() {
                  var s = stageSize();
                  return pts.map(function (p) { return [p[0] * s[0], p[1] * s[1]]; });
                }
                function render() {
                  fitCanvas();
                  var px = pixels(), i;
                  quad.style.transform = transformFor(px);
                  var poly = px.map(function (p) { return p[0].toFixed(1) + 'px ' + p[1].toFixed(1) + 'px'; }).join(',');
                  light.style.clipPath = 'polygon(' + poly + ')';
                  light.style.webkitClipPath = 'polygon(' + poly + ')';
                  shape.setAttribute('points', px.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '));
                  var s = stageSize();
                  outline.setAttribute('viewBox', '0 0 ' + s[0] + ' ' + s[1]);
                  for (i = 0; i < handles.length; i++) {
                    handles[i].style.left = px[i][0] + 'px';
                    handles[i].style.top = px[i][1] + 'px';
                  }
                }
                function setRoom(src) {
                  room.src = src;
                  light.style.backgroundImage = 'url("' + src + '")';
                  backdrop.style.backgroundImage = 'url("' + src + '")';
                }
                function setPitch(v) {
                  // One texture tile holds 8 slats, so the tile width is 8 * pitch.
                  fill.style.backgroundSize = (v * 8) + 'px auto';
                }
                function selectStone(stone, btn) {
                  fill.style.backgroundImage = 'url("/images/visualizer/slat-' + stone.slug + '.webp")';
                  Array.prototype.forEach.call(picker.children, function (c) { c.classList.remove('is-active'); });
                  if (btn) btn.classList.add('is-active');
                }

                // ---------- controls ----------
                STONES.forEach(function (stone, i) {
                  var b = document.createElement('button');
                  b.type = 'button';
                  b.className = 'av-swatch';
                  b.innerHTML =
                    '<span class="av-swatch-img" style="background-image:url(\'/images/visualizer/swatch-' + stone.slug + '.webp\')"></span>' +
                    '<span class="av-swatch-name">' + stone.name + '</span>';
                  b.addEventListener('click', function () { selectStone(stone, b); });
                  picker.appendChild(b);
                  if (i === 0) selectStone(stone, b);
                });

                SCENES.forEach(function (src, i) {
                  var b = document.createElement('button');
                  b.type = 'button';
                  b.className = 'av-scene' + (i === 0 ? ' is-active' : '');
                  b.setAttribute('aria-label', 'Raum ' + (i + 1));
                  b.style.backgroundImage = 'url("' + src + '")';
                  b.addEventListener('click', function () {
                    setRoom(src);
                    Array.prototype.forEach.call(scenes.children, function (c) { c.classList.remove('is-active'); });
                    b.classList.add('is-active');
                  });
                  scenes.appendChild(b);
                });

                for (var h = 0; h < 4; h++) {
                  var el = document.createElement('button');
                  el.type = 'button';
                  el.className = 'av-handle';
                  el.dataset.index = String(h);
                  el.setAttribute('aria-label', 'Ecke ' + (h + 1));
                  handlesBox.appendChild(el);
                  handles.push(el);
                }

                setRoom(SCENES[0]);
                setPitch(parseInt(pitchInput.value, 10));
                pitchInput.addEventListener('input', function () { setPitch(parseInt(pitchInput.value, 10)); });

                document.getElementById('av-file').addEventListener('change', function (e) {
                  var f = e.target.files && e.target.files[0];
                  if (!f) return;
                  setRoom(URL.createObjectURL(f));
                  Array.prototype.forEach.call(scenes.children, function (c) { c.classList.remove('is-active'); });
                });
                document.getElementById('av-reset').addEventListener('click', function () {
                  pts = DEFAULT_PTS.map(function (p) { return [p[0], p[1]]; });
                  pitchInput.value = 52;
                  setPitch(52);
                  setRoom(SCENES[0]);
                  Array.prototype.forEach.call(scenes.children, function (c, i) { c.classList.toggle('is-active', i === 0); });
                  stage.classList.remove('is-touched');
                  hint.classList.remove('is-hidden');
                  render();
                });

                // ---------- interaction ----------
                var pointers = {};      // active pointers by id
                var gesture = null;     // { type, index, start, pts }
                var idleTimer = null;

                function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
                function local(e) {
                  var r = canvas.getBoundingClientRect();
                  return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
                }
                function inside(p) {
                  var hit = false, i, j;
                  for (i = 0, j = 3; i < 4; j = i++) {
                    var a = pts[i], b = pts[j];
                    if ((a[1] > p[1]) !== (b[1] > p[1]) &&
                        p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) hit = !hit;
                  }
                  return hit;
                }
                function snapshot() { return pts.map(function (p) { return [p[0], p[1]]; }); }
                function activate() {
                  stage.classList.add('is-active');
                  hint.classList.add('is-hidden');
                  clearTimeout(idleTimer);
                }
                function deactivate() {
                  clearTimeout(idleTimer);
                  idleTimer = setTimeout(function () { stage.classList.remove('is-active'); }, 1400);
                }
                function pointerList() {
                  return Object.keys(pointers).map(function (k) { return pointers[k]; });
                }

                canvas.addEventListener('pointerdown', function (e) {
                  var p = local(e);
                  var handleIndex = e.target.classList && e.target.classList.contains('av-handle')
                    ? parseInt(e.target.dataset.index, 10) : -1;
                  if (handleIndex < 0 && !inside(p)) return;

                  pointers[e.pointerId] = p;
                  canvas.setPointerCapture(e.pointerId);
                  activate();
                  e.preventDefault();

                  var list = pointerList();
                  if (list.length >= 2) {
                    gesture = { type: 'pinch', start: list.slice(0, 2).map(function (q) { return [q[0], q[1]]; }), pts: snapshot() };
                  } else if (handleIndex >= 0) {
                    gesture = { type: 'corner', index: handleIndex, start: p, pts: snapshot() };
                  } else {
                    gesture = { type: 'move', start: p, pts: snapshot() };
                  }
                });

                canvas.addEventListener('pointermove', function (e) {
                  if (!(e.pointerId in pointers) || !gesture) return;
                  pointers[e.pointerId] = local(e);
                  var list = pointerList();

                  if (gesture.type === 'corner') {
                    var p = pointers[e.pointerId];
                    pts[gesture.index] = [clamp01(p[0]), clamp01(p[1])];
                  } else if (gesture.type === 'move') {
                    var q = pointers[e.pointerId];
                    var dx = q[0] - gesture.start[0], dy = q[1] - gesture.start[1];
                    // Shift as a whole, but never past the edges of the photo.
                    var xs = gesture.pts.map(function (c) { return c[0]; });
                    var ys = gesture.pts.map(function (c) { return c[1]; });
                    dx = Math.max(-Math.min.apply(null, xs), Math.min(dx, 1 - Math.max.apply(null, xs)));
                    dy = Math.max(-Math.min.apply(null, ys), Math.min(dy, 1 - Math.max.apply(null, ys)));
                    pts = gesture.pts.map(function (c) { return [c[0] + dx, c[1] + dy]; });
                  } else if (gesture.type === 'pinch' && list.length >= 2) {
                    var a0 = gesture.start[0], b0 = gesture.start[1];
                    var a1 = list[0], b1 = list[1];
                    var d0 = Math.hypot(b0[0] - a0[0], b0[1] - a0[1]) || 1e-6;
                    var d1 = Math.hypot(b1[0] - a1[0], b1[1] - a1[1]);
                    var scale = Math.max(0.2, Math.min(4, d1 / d0));
                    var c0 = [(a0[0] + b0[0]) / 2, (a0[1] + b0[1]) / 2];
                    var c1 = [(a1[0] + b1[0]) / 2, (a1[1] + b1[1]) / 2];
                    pts = gesture.pts.map(function (c) {
                      return [
                        clamp01(c1[0] + (c[0] - c0[0]) * scale),
                        clamp01(c1[1] + (c[1] - c0[1]) * scale)
                      ];
                    });
                  }
                  render();
                });

                function endPointer(e) {
                  delete pointers[e.pointerId];
                  if (!pointerList().length) { gesture = null; deactivate(); }
                  else if (gesture && gesture.type === 'pinch') { gesture = null; }
                }
                canvas.addEventListener('pointerup', endPointer);
                canvas.addEventListener('pointercancel', endPointer);

                // Keyboard nudging keeps the corners usable without a pointer.
                handlesBox.addEventListener('keydown', function (e) {
                  var i = e.target.dataset && e.target.dataset.index;
                  if (i === undefined) return;
                  var step = e.shiftKey ? 0.05 : 0.01, d = null;
                  if (e.key === 'ArrowLeft') d = [-step, 0];
                  if (e.key === 'ArrowRight') d = [step, 0];
                  if (e.key === 'ArrowUp') d = [0, -step];
                  if (e.key === 'ArrowDown') d = [0, step];
                  if (!d) return;
                  e.preventDefault();
                  var idx = parseInt(i, 10);
                  pts[idx] = [clamp01(pts[idx][0] + d[0]), clamp01(pts[idx][1] + d[1])];
                  activate();
                  deactivate();
                  render();
                });

                window.addEventListener('resize', render);
                if (window.ResizeObserver) new ResizeObserver(render).observe(stage);
                room.addEventListener('load', render);
                render();

                // Warm the remaining textures so switching stones is instant.
                window.setTimeout(function () {
                  STONES.forEach(function (s) { new Image().src = '/images/visualizer/slat-' + s.slug + '.webp'; });
                  SCENES.forEach(function (s) { new Image().src = s; });
                }, 1200);
              })();
            </script>

            <style>

                padding: 10px 18px; border-radius: 999px;

              }

                position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
                font-size: 17px; font-weight: 600; letter-spacing: -.02em;
              }

                display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
                font-family: inherit; font-size: 13px; font-weight: 600; line-height: 1;
                padding: 12px 20px; border-radius: 999px; border: 1px solid #0d0d0d;
                background: #0d0d0d; color: #fff; white-space: nowrap;
                transition: opacity .15s ease, transform .15s ease;
              }
              #akurock-visualizer .av-btn:hover { opacity: .85; transform: translateY(-1px); }
              #akurock-visualizer .av-ghost { background: transparent; color: #0d0d0d; border-color: rgba(13,13,13,.22); }
              #akurock-visualizer .av-ghost:hover { border-color: #0d0d0d; opacity: 1; }

              #akurock-visualizer .av-backdrop {

                position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);

              #akurock-visualizer .av-quad {
                position: absolute; left: 0; top: 0; width: 1000px; height: 1000px;
                transform-origin: 0 0; will-change: transform;
                box-shadow: 12px 22px 46px rgba(13,13,13,.34);

              #akurock-visualizer .av-stage.is-active .av-canvas { box-shadow: 0 20px 50px rgba(13,13,13,.28); }
              #akurock-visualizer .av-fill {
                position: absolute; inset: 0;

                filter: brightness(1.12) contrast(1.02);
              }
              /* Edge relief: a hint of thickness at the top and a shadow line at

              #akurock-visualizer .av-relief {

                  linear-gradient(90deg, rgba(13,13,13,.14), rgba(13,13,13,0) 3%),
                  linear-gradient(270deg, rgba(255,255,255,.10), rgba(255,255,255,0) 3%);
                box-shadow: inset 0 0 0 1px rgba(13,13,13,.16);

              /* Blurred copy of the room, multiplied over the panel and clipped to

              #akurock-visualizer .av-light {

                filter: blur(26px) saturate(.9);
                mix-blend-mode: multiply; opacity: .55;
              }
              #akurock-visualizer .av-outline {
                position: absolute; inset: 0; width: 100%; height: 100%;

              #akurock-visualizer .av-outline polygon {

              #akurock-visualizer .av-handle {

              }
              #akurock-visualizer .av-handle:hover,
              #akurock-visualizer .av-handle:focus-visible,
              #akurock-visualizer .av-stage.is-active .av-handle { opacity: 1; }
              #akurock-visualizer .av-handle:active { transform: translate(-50%,-50%) scale(1.12); }

              #akurock-visualizer .av-hint {
                position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
                background: rgba(13,13,13,.74); color: #fff; font-size: 12.5px; font-weight: 500;
                padding: 9px 16px; border-radius: 999px; max-width: 92%; text-align: center;
                transition: opacity .3s ease; pointer-events: none;
              }
              #akurock-visualizer .av-hint.is-hidden { opacity: 0; }

              #akurock-visualizer .av-dock {
                flex: none; padding: 14px 18px calc(12px + env(safe-area-inset-bottom));
              }
              #akurock-visualizer .av-picker {
                display: flex; gap: 14px; overflow-x: auto; padding-bottom: 10px;
                scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
              }
              #akurock-visualizer .av-picker::-webkit-scrollbar { display: none; }
              #akurock-visualizer .av-swatch {
                flex: none; scroll-snap-align: center;
                display: flex; flex-direction: column; align-items: center; gap: 7px;
                border: none; background: none; padding: 0; cursor: pointer; font-family: inherit;

              #akurock-visualizer .av-swatch-img {

                background-size: cover; background-position: center;

                transition: outline-color .18s ease, transform .18s ease;
              }
              #akurock-visualizer .av-swatch:hover .av-swatch-img { transform: scale(1.05); }
              #akurock-visualizer .av-swatch.is-active .av-swatch-img { outline-color: #f24616; transform: scale(1.05); }
              #akurock-visualizer .av-swatch-name { font-size: 12px; font-weight: 600; color: #6b6b6b; }
              #akurock-visualizer .av-swatch.is-active .av-swatch-name { color: #0d0d0d; }

              #akurock-visualizer .av-tools {
                display: flex; align-items: center; justify-content: space-between; gap: 18px;
                padding-top: 12px; border-top: 1px solid rgba(13,13,13,.08);
              }
              #akurock-visualizer .av-scenes { display: flex; gap: 8px; }
              #akurock-visualizer .av-scene {
                width: 42px; height: 32px; border-radius: 9px; border: none; padding: 0; cursor: pointer;
                background-size: cover; background-position: center;
                box-shadow: 0 0 0 1px rgba(13,13,13,.12);
                outline: 2px solid transparent; outline-offset: 2px;
                transition: outline-color .18s ease, transform .18s ease;
              }
              #akurock-visualizer .av-scene:hover { transform: translateY(-1px); }
              #akurock-visualizer .av-scene.is-active { outline-color: #f24616; }

              #akurock-visualizer .av-range { display: flex; align-items: center; gap: 12px; min-width: 0; }
              #akurock-visualizer .av-range-label {
                font-size: 12px; font-weight: 600; color: #6b6b6b; white-space: nowrap;
              }
              #akurock-visualizer .av-range input {

                height: 4px; border-radius: 999px; background: rgba(13,13,13,.14); outline: none;

              #akurock-visualizer .av-range input::-webkit-slider-thumb {

                border-radius: 50%; background: #0d0d0d; border: 3px solid #fff;
                box-shadow: 0 1px 6px rgba(13,13,13,.3); cursor: pointer;
              }
              #akurock-visualizer .av-range input::-moz-range-thumb {
                width: 18px; height: 18px; border-radius: 50%; background: #0d0d0d;

              }

              @media (max-width: 720px) {
                .av-back { top: 12px; left: 12px; padding: 9px 14px; font-size: 13px; }
                #akurock-visualizer .av-topbar { padding: 12px 12px 8px 130px; }
                #akurock-visualizer .av-title { display: none; }
                #akurock-visualizer .av-topbar { justify-content: flex-end; }
                #akurock-visualizer .av-actions { display: flex; gap: 8px; }
                #akurock-visualizer .av-btn { padding: 0; width: 42px; height: 42px; justify-content: center; }
                #akurock-visualizer .av-btn-text {

                  clip: rect(0 0 0 0); white-space: nowrap;

                #akurock-visualizer .av-icon { width: 19px; height: 19px; }
                #akurock-visualizer .av-stage { margin: 0 12px; border-radius: 14px; }
                #akurock-visualizer .av-dock { padding: 12px 12px calc(10px + env(safe-area-inset-bottom)); }
                #akurock-visualizer .av-swatch-img { width: 46px; height: 46px; }
                #akurock-visualizer .av-handle { width: 28px; height: 28px; opacity: .85; }
                #akurock-visualizer .av-tools { gap: 12px; }

                #akurock-visualizer .av-hint { font-size: 11.5px; bottom: 12px; }

        </div>
      </section>
    </div>

  <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=64ad4116e38ed7d405f77d26"
    type="text/javascript" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0="
    crossorigin="anonymous"></script>
  <script src="/js/webflow.js" type="text/javascript"></script><!--  CUSTOM QUANTITY BUTTONS  -->
  <script>
    (globalThis.CodeCrumbs = globalThis.CodeCrumbs || {}).QuantityButtons = function (options) {
      // Optionen mit Standardwerten
      const {
        quantityGroupClass: groupClass = "q-group",
        quantityIncrementButtonClass: incClass = "q-inc",
        quantityDecrementButtonClass: decClass = "q-dec",
        quantityNumberFieldClass: numFieldClass = "q-num",
        disableDecrementAtOne: disableAtOne = true
      } = options;
      // Funktion zum Aktualisieren des Decrement-Buttons
      function updateDecrementButton(input, decButton) {
        const disable = disableAtOne && parseInt(input.value, 10) <= 1;
        decButton.toggleAttribute("disabled", disable);
        decButton.classList.toggle("disabled", disable);
      }
      // Initialisierungsfunktion
      function init() {
        document.querySelectorAll(`.${groupClass}`).forEach(group => {
          const input = group.querySelector(`.${numFieldClass}`);
          const decButton = group.querySelector(`.${decClass}`);
          if (input && decButton) {
            updateDecrementButton(input, decButton);
          }
        });
      }
      // Initialisierung beim Laden des Dokuments
      if (document.readyState !== "loading") {
        init();
      } else {
        document.addEventListener("DOMContentLoaded", init);
      }
      // Event Listener für Klicks (Event Delegation)
      document.addEventListener("click", function (event) {
        let target = event.target;
        // Suchen nach dem angeklickten Increment- oder Decrement-Button
        while (target && target.nodeType === Node.ELEMENT_NODE && (!target.classList || (!target.classList.contains(incClass) && !target.classList.contains(decClass)))) {
          target = target.parentNode;
        }
        if (target && target instanceof Element) {
          const group = target.closest(`.${groupClass}`);
          const input = group.querySelector(`.${numFieldClass}`);
          const decButton = group.querySelector(`.${decClass}`);
          let value = parseInt(input.value, 10);
          if (target.classList.contains(incClass)) {
            input.value = value + 1;
          } else if (target.classList.contains(decClass)) {
            input.value = Math.max(value - 1, 1);
          }
          updateDecrementButton(input, decButton);
          // Dispatch eines 'change'-Events
          input.dispatchEvent(new Event('change', { bubbles: true }));
        }
      });
      // MutationObserver zur Überwachung von Änderungen
      new MutationObserver((mutations) => {
        mutations.forEach(mutation => {
          if (mutation.type === "attributes" && mutation.attributeName === "value") {
            init();
          }
        });
      }).observe(document, {
        attributes: true,
        subtree: true,
        attributeFilter: ["value"]
      });
    };
    // Initialisierung der QuantityButtons
    document.addEventListener('DOMContentLoaded', function () {
      window.CodeCrumbs.QuantityButtons({
        quantityGroupClass: 'q-group',
        quantityIncrementButtonClass: 'q-inc',
        quantityDecrementButtonClass: 'q-dec',
        quantityNumberFieldClass: 'q-num',
        disableDecrementAtOne: true,
      });
    });
  </script>
