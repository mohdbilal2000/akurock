            <script>
              (function () {
                var STONES = [
                  { slug: 'whisper', name: 'Whisper', tex: '/images/6672b83a8bd67b5b72bbd5fb_Whisper_Paneel.webp', sw: '/images/6672b845e7846b687ecca399_Whisper_Stone.webp' },
                  { slug: 'brush',   name: 'Brush',   tex: '/images/6672c45aa4067e84ea2efbae_Brush_Paneele.webp', sw: '/images/6672c465bb2c1f412c8d9dbd_Brush_Stone.webp' },
                  { slug: 'gaia',    name: 'Gaia',    tex: '/images/6672c5618fb534f344983a07_Gaia_Stone.webp',   sw: '/images/6672c5618fb534f344983a07_Gaia_Stone.webp' },
                  { slug: 'yami',    name: 'Yami',    tex: '/images/6672c4a3cc07e459748b16a8_Yami_Paneel.webp',  sw: '/images/6672c50ce1fa6622177a75ca_Yami_Stone.webp' },
                  { slug: 'yuki',    name: 'Yuki',    tex: '/images/6672c643b9abe5d94880a355_Yuki_Paneel.webp',  sw: '/images/6672c64c321c865a6ece5d6d_Yuki_Stone.webp' },
                  { slug: 'ligia',   name: 'Ligia',   tex: '/images/6672c5cccadaf188f323804b_Ligia_Paneel.webp', sw: '/images/6672c5d54c31e70e1894d52f_ligia_Stone.webp' }
                ];
                var picker = document.getElementById('av-picker');
                var panel = document.getElementById('av-panel');
                var fill = panel.querySelector('.av-panel-fill');
                var stage = document.getElementById('av-stage');
                var room = document.getElementById('av-room');
                var resize = document.getElementById('av-resize');
                var hint = document.getElementById('av-hint');

                function selectStone(s, btn) {
                  fill.style.backgroundImage = 'url("' + s.tex + '")';
                  Array.prototype.forEach.call(picker.children, function (c) { c.classList.remove('active'); });
                  if (btn) btn.classList.add('active');
                }
                STONES.forEach(function (s, i) {
                  var b = document.createElement('button');
                  b.type = 'button';
                  b.className = 'av-swatch';
                  b.innerHTML = '<span class="av-swatch-img" style="background-image:url(\'' + s.sw + '\')"></span><span class="av-swatch-name">' + s.name + '</span>';
                  b.addEventListener('click', function () { selectStone(s, b); });
                  picker.appendChild(b);
                  if (i === 0) selectStone(s, b);
                });

                // ---- drag + resize (pointer events: mouse + touch) ----
                var dragging = false, resizing = false, sx = 0, sy = 0, sl = 0, st = 0, sw = 0, sh = 0;
                function stageBox() { return stage.getBoundingClientRect(); }
                function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

                panel.addEventListener('pointerdown', function (e) {
                  if (e.target === resize) return;
                  dragging = true; panel.setPointerCapture(e.pointerId);
                  var r = panel.getBoundingClientRect(), b = stageBox();
                  sx = e.clientX; sy = e.clientY; sl = r.left - b.left; st = r.top - b.top;
                  hint.style.opacity = '0';
                  e.preventDefault();
                });
                resize.addEventListener('pointerdown', function (e) {
                  resizing = true; resize.setPointerCapture(e.pointerId);
                  sx = e.clientX; sy = e.clientY; sw = panel.offsetWidth; sh = panel.offsetHeight;
                  e.preventDefault(); e.stopPropagation();
                });
                window.addEventListener('pointermove', function (e) {
                  var b = stageBox();
                  if (dragging) {
                    var nl = clamp(sl + (e.clientX - sx), 0, b.width - panel.offsetWidth);
                    var nt = clamp(st + (e.clientY - sy), 0, b.height - panel.offsetHeight);
                    panel.style.left = nl + 'px'; panel.style.top = nt + 'px';
                  } else if (resizing) {
                    var nw = clamp(sw + (e.clientX - sx), 60, b.width - panel.offsetLeft);
                    var nh = clamp(sh + (e.clientY - sy), 60, b.height - panel.offsetTop);
                    panel.style.width = nw + 'px'; panel.style.height = nh + 'px';
                  }
                });
                window.addEventListener('pointerup', function () { dragging = false; resizing = false; });

                // ---- upload own room ----
                document.getElementById('av-file').addEventListener('change', function (e) {
                  var f = e.target.files && e.target.files[0];
                  if (!f) return;
                  room.src = URL.createObjectURL(f);
                });
                document.getElementById('av-reset').addEventListener('click', function () {
                  room.src = '/images/Skandi_Bedroom_3.webp';
                  panel.style.left = ''; panel.style.top = ''; panel.style.width = ''; panel.style.height = '';
                  hint.style.opacity = '';
                });
              })();
            </script>

  <script>
    (globalThis.CodeCrumbs = globalThis.CodeCrumbs || {}).QuantityButtons = function (options) {
      // Optionen mit Standardwerten
      const {
        quantityGroupClass: groupClass = "q-group",
        quantityIncrementButtonClass: incClass = "q-inc",
        quantityDecrementButtonClass: decClass = "q-dec",
        quantityNumberFieldClass: numFieldClass = "q-num",
        disableDecrementAtOne: disableAtOne = true
      } = options;
      // Funktion zum Aktualisieren des Decrement-Buttons
      function updateDecrementButton(input, decButton) {
        const disable = disableAtOne && parseInt(input.value, 10) <= 1;
        decButton.toggleAttribute("disabled", disable);
        decButton.classList.toggle("disabled", disable);
      }
      // Initialisierungsfunktion
      function init() {
        document.querySelectorAll(`.${groupClass}`).forEach(group => {
          const input = group.querySelector(`.${numFieldClass}`);
          const decButton = group.querySelector(`.${decClass}`);
          if (input && decButton) {
            updateDecrementButton(input, decButton);
          }
        });
      }
      // Initialisierung beim Laden des Dokuments
      if (document.readyState !== "loading") {
        init();
      } else {
        document.addEventListener("DOMContentLoaded", init);
      }
      // Event Listener für Klicks (Event Delegation)
      document.addEventListener("click", function (event) {
        let target = event.target;
        // Suchen nach dem angeklickten Increment- oder Decrement-Button
        while (target && target.nodeType === Node.ELEMENT_NODE && (!target.classList || (!target.classList.contains(incClass) && !target.classList.contains(decClass)))) {
          target = target.parentNode;
        }
        if (target && target instanceof Element) {
          const group = target.closest(`.${groupClass}`);
          const input = group.querySelector(`.${numFieldClass}`);
          const decButton = group.querySelector(`.${decClass}`);
          let value = parseInt(input.value, 10);
          if (target.classList.contains(incClass)) {
            input.value = value + 1;
          } else if (target.classList.contains(decClass)) {
            input.value = Math.max(value - 1, 1);
          }
          updateDecrementButton(input, decButton);
          // Dispatch eines 'change'-Events
          input.dispatchEvent(new Event('change', { bubbles: true }));
        }
      });
      // MutationObserver zur Überwachung von Änderungen
      new MutationObserver((mutations) => {
        mutations.forEach(mutation => {
          if (mutation.type === "attributes" && mutation.attributeName === "value") {
            init();
          }
        });
      }).observe(document, {
        attributes: true,
        subtree: true,
        attributeFilter: ["value"]
      });
    };
    // Initialisierung der QuantityButtons
    document.addEventListener('DOMContentLoaded', function () {
      window.CodeCrumbs.QuantityButtons({
        quantityGroupClass: 'q-group',
        quantityIncrementButtonClass: 'q-inc',
        quantityDecrementButtonClass: 'q-dec',
        quantityNumberFieldClass: 'q-num',
        disableDecrementAtOne: true,
      });
    });
  </script>
